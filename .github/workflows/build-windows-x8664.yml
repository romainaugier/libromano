name: Windows x86_64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: get-cmake
        uses: lukka/get-cmake@latest

      - name: Build concurrentqueue
        run: |
          cd ext/concurrentqueue
          git pull origin master
          ./build_c_api.bat
          cd ..

      - name: build and test with addr san
        run: |
          ./build.bat --tests --reldebug --addrsan --clean
          type build\Testing\Temporary\LastTest.log

      - name: build and test
        run: |
          ./build.bat --tests --reldebug --clean
          type build\Testing\Temporary\LastTest.log
