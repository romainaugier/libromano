name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: get-cmake
        uses: lukka/get-cmake@latest

      - name: Install tools
        run: pip install gcovr

      - name: Build concurrentqueue
        run: |
          cd ext/concurrentqueue
          ./build_c_api.sh

      - name: Configure & build with coverage
        run: |
          cmake -S . -B build -DRUN_TESTS=1 -DCOVERAGE=ON \
                -DCMAKE_BUILD_TYPE=Debug -DVERSION=0.0.0
          cmake --build build -j $(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage
          gcovr --root . \
                --filter 'src/' --filter 'include/' \
                --print-summary \
                --xml build/coverage.xml \
                --html-details build/coverage/index.html \
                build

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true